<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundStream WebUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.05)',
                            200: 'rgba(255, 255, 255, 0.1)',
                            300: 'rgba(255, 255, 255, 0.15)'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-75 min-h-screen text-black font-sans overflow-x-hidden selection:bg-gray-300 selection:text-black">

    <div class="relative z-10 container mx-auto px-4 py-8 max-w-7xl h-screen flex flex-col">
        <!-- Header -->
        <header class="mb-8 flex items-center justify-between animate-fade-in">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-black">
                        SoundStream</h1>
                    <p class="text-black text-sm font-medium tracking-wide">WebUI</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-3 border border-white/10">
                    <div class="relative">
                        <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-gray-500 transition-colors duration-300">
                        </div>
                        <div id="statusPing"
                            class="absolute inset-0 w-2.5 h-2.5 rounded-full bg-gray-500 animate-ping opacity-0"></div>
                    </div>
                    <span id="statusText" class="text-sm font-medium text-black">System Ready</span>
                </div>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1 min-h-0">

            <!-- Left Sidebar (Controls) -->
            <div class="lg:col-span-4 space-y-6 animate-slide-up" style="animation-delay: 0.1s;">

                <!-- Audio Control Card -->
                <div class="glass-card p-6 rounded-3xl border border-white/5 relative overflow-hidden group">
                    <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                    </div>

                    <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">
                            </path>
                        </svg>
                        Control Center
                    </h2>

                    <div class="space-y-6 relative z-10">
                        <!-- Device Select -->
                        <div class="space-y-2">
                            <label class="text-xs font-semibold text-black uppercase tracking-wider">Input
                                Source</label>
                            <div class="relative">
                                <select id="audioDeviceSelect"
                                    class="w-full bg-white/50 border border-black/20 rounded-xl px-4 py-3 text-sm text-black focus:outline-none focus:border-black/50 focus:ring-1 focus:ring-black/50 transition-all appearance-none cursor-pointer hover:bg-white/70">
                                    <option value="">Select source...</option>
                                </select>
                                <div
                                    class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="grid grid-cols-2 gap-4">
                            <button id="startBtn" class="btn-primary relative overflow-hidden group">
                                <span class="relative z-10 flex items-center justify-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                                        </path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Start
                                </span>
                                <div
                                    class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                </div>
                            </button>

                            <button id="stopBtn" disabled class="btn-secondary">
                                <span class="flex items-center justify-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z">
                                        </path>
                                    </svg>
                                    Stop
                                </span>
                            </button>
                        </div>

                        <!-- Noise Reduction Toggle -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center text-primary">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z">
                                        </path>
                                    </svg>
                                </div>
                                <div>
                                    <span class="text-sm font-medium text-black">Noise Reduction</span>
                                    <p class="text-xs text-black/70">Reduce background static</p>
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="noiseReductionToggle" class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Device Management -->
                <div class="glass-card p-6 rounded-3xl border border-white/5">
                    <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                            </path>
                        </svg>
                        Network Devices
                    </h2>

                    <div class="grid grid-cols-2 gap-3">
                        <button id="scanBtn"
                            class="btn-glass flex flex-col items-center justify-center py-4 gap-2 group">
                            <div
                                class="w-10 h-10 rounded-full bg-accent/10 flex items-center justify-center text-accent group-hover:scale-110 transition-transform">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                            <span class="text-xs font-medium">Scan Network</span>
                        </button>

                        <button id="addDeviceBtn"
                            class="btn-glass flex flex-col items-center justify-center py-4 gap-2 group">
                            <div
                                class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4"></path>
                                </svg>
                            </div>
                            <span class="text-xs font-medium">Add Manual</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Center/Right Panel (Visualizer & List) -->
            <div class="lg:col-span-8 flex flex-col gap-6 animate-slide-up" style="animation-delay: 0.2s;">

                <!-- Visualizer Card -->
                <div
                    class="glass-card p-1 rounded-3xl border border-white/5 relative overflow-hidden min-h-[240px] flex flex-col">
                    <div class="absolute top-6 left-6 z-10">
                        <h2 class="text-xl font-semibold flex items-center gap-2">
                            <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3">
                                </path>
                            </svg>
                            Live Spectrum
                        </h2>
                    </div>

                    <!-- Volume Indicator -->
                    <div class="absolute top-6 right-6 z-10 flex items-center gap-3">
                        <div class="text-xs font-mono text-gray-400">VOL</div>
                        <div class="w-32 h-1.5 bg-dark-300/50 rounded-full overflow-hidden backdrop-blur-sm">
                            <div id="volumeBar" class="h-full bg-black transition-all duration-75 w-0">
                            </div>
                        </div>
                        <div id="volumePercent" class="text-xs font-mono text-white w-8 text-right">0%</div>
                    </div>

                    <canvas id="waveformCanvas" class="w-full h-full rounded-[20px] bg-dark-400/30"></canvas>
                </div>

                <!-- Devices List -->
                <div class="glass-card flex-1 rounded-3xl border border-white/5 flex flex-col overflow-hidden">
                    <div class="p-6 border-b border-white/5 flex items-center justify-between">
                        <h2 class="text-xl font-semibold">Connected Devices</h2>
                        <span id="deviceCount"
                            class="px-3 py-1 rounded-full bg-white/5 text-xs font-medium text-gray-300 border border-white/5">0
                            Active</span>
                    </div>

                    <div id="deviceList"
                        class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto custom-scrollbar">
                        <!-- Devices will be injected here -->
                        <div class="col-span-full flex flex-col items-center justify-center py-12 text-gray-500">
                            <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center mb-4">
                                <svg class="w-8 h-8 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </div>
                            <p>No devices connected</p>
                        </div>
                    </div>
                </div>

                <!-- Logs Toggle -->
                <div class="glass-card rounded-2xl border border-white/5 overflow-hidden col-span-12 w-full">
                    <button id="logsToggle"
                        class="w-full px-6 py-3 flex items-center justify-between hover:bg-white/5 transition-colors">
                        <span class="text-sm font-medium text-gray-400 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            System Logs
                        </span>
                        <svg id="logsChevron" class="w-4 h-4 text-gray-500 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div id="logsContent" class="hidden border-t border-white/5">
                        <div class="p-4">
                            <div class="flex justify-end mb-2">
                                <button id="clearLogsBtn"
                                    class="text-xs text-gray-500 hover:text-white transition-colors">Clear
                                    History</button>
                            </div>
                            <div id="logsContainer"
                                class="h-32 overflow-y-auto font-mono text-xs text-gray-400 space-y-1 custom-scrollbar p-2 bg-black/20 rounded-lg">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modals (Glassmorphism Style) -->
    <!-- Add Device Modal -->
    <div id="addDeviceModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
            onclick="closeModal('addDeviceModal')"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
            <div
                class="glass-card rounded-3xl border border-white/10 overflow-hidden shadow-2xl transform transition-all scale-100">
                <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                    <h3 class="text-lg font-semibold text-white">Add New Device</h3>
                    <button onclick="closeModal('addDeviceModal')" class="text-gray-400 hover:text-white"><svg
                            class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg></button>
                </div>
                <div class="p-6 space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase font-semibold">Device Name</label>
                        <input type="text" id="deviceName" class="input-glass w-full" placeholder="Living Room Speaker">
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-2 space-y-2">
                            <label class="text-xs text-gray-400 uppercase font-semibold">IP Address</label>
                            <input type="text" id="deviceIP" class="input-glass w-full" placeholder="192.168.1.x">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs text-gray-400 uppercase font-semibold">Port</label>
                            <input type="number" id="devicePort" class="input-glass w-full" value="6666">
                        </div>
                    </div>
                </div>
                <div class="p-6 border-t border-white/5 flex gap-3 bg-black/20">
                    <button onclick="closeModal('addDeviceModal')" class="btn-secondary flex-1">Cancel</button>
                    <button id="saveDeviceBtn" class="btn-primary flex-1">Add Device</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Device Modal -->
    <div id="editDeviceModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal('editDeviceModal')"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
            <div class="glass-card rounded-3xl border border-white/10 overflow-hidden shadow-2xl">
                <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                    <h3 class="text-lg font-semibold text-white">Edit Device</h3>
                    <button onclick="closeModal('editDeviceModal')" class="text-gray-400 hover:text-white"><svg
                            class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg></button>
                </div>
                <div class="p-6 space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase font-semibold">Device Name</label>
                        <input type="text" id="editDeviceName" class="input-glass w-full">
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-2 space-y-2">
                            <label class="text-xs text-gray-400 uppercase font-semibold">IP Address</label>
                            <input type="text" id="editDeviceIP" class="input-glass w-full">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs text-gray-400 uppercase font-semibold">Port</label>
                            <input type="number" id="editDevicePort" class="input-glass w-full">
                        </div>
                    </div>
                </div>
                <div class="p-6 border-t border-white/5 flex gap-3 bg-black/20">
                    <button onclick="closeModal('editDeviceModal')" class="btn-secondary flex-1">Cancel</button>
                    <button id="updateDeviceBtn" class="btn-primary flex-1">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scan Modal -->
    <div id="scanModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal('scanModal')"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl p-4">
            <div class="glass-card rounded-3xl border border-white/10 overflow-hidden shadow-2xl">
                <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                    <h3 class="text-lg font-semibold text-white">Device Discovery</h3>
                    <button onclick="closeModal('scanModal')" class="text-gray-400 hover:text-white"><svg
                            class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg></button>
                </div>
                <div class="p-6 min-h-[300px]">
                    <div id="scanResults" class="h-full">
                        <!-- Content injected by JS -->
                    </div>
                </div>
                <div class="p-6 border-t border-white/5 flex justify-end bg-black/20">
                    <button onclick="closeModal('scanModal')" class="btn-secondary px-6">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
